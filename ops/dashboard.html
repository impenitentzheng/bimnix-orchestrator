<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIMNIX CEO Resource Dashboard R05</title><style>
:root{font-family:Inter,Arial,sans-serif;color-scheme:dark}body{margin:0;background:#0b0d10;color:#eef2f7}.wrap{max-width:1300px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}.muted{color:#8f9baa}.controls{display:flex;gap:8px;flex-wrap:wrap}button,input{background:#151a20;color:#eef2f7;border:1px solid #303946;border-radius:10px;padding:9px 12px}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0}.kpi,.panel{background:#12161c;border:1px solid #262e39;border-radius:14px;padding:16px}.kpi b{display:block;font-size:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel h2{margin-top:0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #242c36;vertical-align:top}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}.ACTIVE{background:#153d2a;color:#8ee6b5}.BLOCKED{background:#4a251f;color:#ffac9c}.HOLD{background:#463a18;color:#f0d37d}.DONE{background:#173047;color:#9bcdf5}.UNKNOWN{background:#333842;color:#c7cbd1}.P0{font-weight:800;color:#ff9c8e}.P1{font-weight:800;color:#f1cb74}.event{padding:10px 0;border-bottom:1px solid #242c36}.event:last-child{border-bottom:0}.err{color:#ff9c8e}.ok{color:#8ee6b5}@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.summary{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><div><div class="muted">BIMNIX CONTROL PLANE</div><h1>CEO Resource Dashboard <small class="muted">R05</small></h1><div id="stamp" class="muted">No state loaded</div></div><div class="controls"><input id="file" type="file" accept="application/json,.json"><button id="example">Load example</button><button id="fetch">Fetch endpoint</button></div></div><div id="msg" class="muted"></div><section class="summary"><div class="kpi"><span class="muted">Resources</span><b id="kResources">0</b></div><div class="kpi"><span class="muted">Active</span><b id="kActive">0</b></div><div class="kpi"><span class="muted">Blocked</span><b id="kBlocked">0</b></div><div class="kpi"><span class="muted">P0 open</span><b id="kP0">0</b></div><div class="kpi"><span class="muted">Done</span><b id="kDone">0</b></div></section><section class="grid"><div class="panel"><h2>Resources / heartbeat</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Kind</th><th>Status</th><th>Heartbeat</th><th>Quota</th></tr></thead><tbody id="resources"></tbody></table></div></div><div class="panel"><h2>Task registry</h2><div style="overflow:auto"><table><thead><tr><th>Priority</th><th>Task</th><th>Status</th><th>Owner</th><th>Blocker / resume</th></tr></thead><tbody id="tasks"></tbody></table></div></div><div class="panel" style="grid-column:1/-1"><h2>Event log</h2><div id="events"></div></div></section></main><script>
const $=id=>document.getElementById(id);const safe=v=>String(v??'UNKNOWN').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const badge=s=>`<span class="badge ${['ACTIVE','BLOCKED','HOLD','DONE','UNKNOWN'].includes(s)?s:'UNKNOWN'}">${safe(s||'UNKNOWN')}</span>`;
function norm(x){return {generated_at:x?.generated_at||null,resources:Array.isArray(x?.resources)?x.resources:[],tasks:Array.isArray(x?.tasks)?x.tasks:[],events:Array.isArray(x?.events)?x.events:[]}}
function render(raw){const d=norm(raw);$('stamp').textContent=d.generated_at?`Generated ${d.generated_at}`:'Generated time UNKNOWN';$('kResources').textContent=d.resources.length;$('kActive').textContent=d.resources.filter(x=>x.status==='ACTIVE').length;$('kBlocked').textContent=d.tasks.filter(x=>x.status==='BLOCKED').length;$('kP0').textContent=d.tasks.filter(x=>x.priority==='P0'&&x.status!=='DONE').length;$('kDone').textContent=d.tasks.filter(x=>x.status==='DONE').length;$('resources').innerHTML=d.resources.map(r=>`<tr><td>${safe(r.id)}</td><td>${safe(r.kind)}</td><td>${badge(r.status)}</td><td>${safe(r.heartbeat_at)}</td><td>${r.quota?`${safe(r.quota.remaining_percent)}% · ${safe(r.quota.resets_at)}`:'—'}</td></tr>`).join('')||'<tr><td colspan=5>UNKNOWN — no resource state</td></tr>';$('tasks').innerHTML=d.tasks.map(t=>`<tr><td class="${safe(t.priority)}">${safe(t.priority)}</td><td>${safe(t.title)}${t.deadline?`<div class=muted>deadline ${safe(t.deadline)}</div>`:''}</td><td>${badge(t.status)}</td><td>${safe(t.owner)}</td><td>${safe(t.blocker||'—')}${t.resume_at?`<div class=muted>resume ${safe(t.resume_at)}</div>`:''}</td></tr>`).join('')||'<tr><td colspan=5>UNKNOWN — no task state</td></tr>';$('events').innerHTML=d.events.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).map(e=>`<div class=event><b>${safe(e.type)}</b> · ${safe(e.subject)} <span class=muted>${safe(e.at)}</span><div>${safe(e.message)}</div></div>`).join('')||'<div class=muted>No events</div>';$('msg').innerHTML='<span class=ok>State loaded.</span>'}
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{render(JSON.parse(await f.text()))}catch(err){$('msg').innerHTML=`<span class=err>Invalid JSON: ${safe(err.message)}</span>`}});$('example').onclick=async()=>{try{render(await (await fetch('./state.example.json',{cache:'no-store'})).json())}catch(e){$('msg').innerHTML=`<span class=err>Example load failed: ${safe(e.message)}</span>`}};$('fetch').onclick=async()=>{const endpoint=new URLSearchParams(location.search).get('endpoint');if(!endpoint){$('msg').innerHTML='<span class=err>No endpoint. Open with ?endpoint=https://… or choose a local JSON file.</span>';return}try{const u=new URL(endpoint);if(u.protocol!=='https:')throw new Error('endpoint must use HTTPS');const r=await fetch(u.toString(),{cache:'no-store',credentials:'omit'});if(!r.ok)throw new Error(`HTTP ${r.status}`);render(await r.json())}catch(e){$('msg').innerHTML=`<span class=err>Endpoint load failed: ${safe(e.message)}</span>`}};
</script></body></html>
