[project]
name = "bimnix-orchestrator"
version = "0.1.0"
description = "BIMNIX Orchestration Layer v1 MVP for owner-by-exception social pipeline."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bimnix-orchestrator = "bimnix_orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
